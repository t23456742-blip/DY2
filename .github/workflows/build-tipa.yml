name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project.yml
        id: root
        run: |
          set -euo pipefail
          echo "Workspace layout:"
          ls -la
          if [ -f project.yml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found project.yml at repo root"
          elif [ -f DYSlimClean/project.yml ]; then
            echo "dir=DYSlimClean" >> "$GITHUB_OUTPUT"
            echo "Found project.yml under DYSlimClean/"
          else
            echo "ERROR: project.yml not found at ./ or ./DYSlimClean/"
            find . -maxdepth 3 -name 'project.yml' -print || true
            exit 1
          fi

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install tools
        run: |
          brew install ldid xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          test -f project.yml
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          xcodebuild \
            -project DYSlimClean.xcodeproj \
            -scheme DYSlimClean \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=14.3 \
            CURRENT_PROJECT_VERSION=143 \
            build

      - name: Package tipa
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          MARKETING_VERSION: "14.3"
          CURRENT_PROJECT_VERSION: "143"
        run: |
          sed -i '' $'s/\r$//' scripts/package-tipa.sh
          chmod +x scripts/package-tipa.sh
          bash scripts/package-tipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYSlimClean-tipa
          path: |
            ${{ steps.root.outputs.dir }}/dist/*.tipa
            ${{ steps.root.outputs.dir }}/dist/*.ipa
          if-no-files-found: error
