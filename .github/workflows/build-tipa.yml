name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install tools
        run: |
          brew install ldid xcodegen
          xcodegen --version

      # 兼容两种仓库布局：project.yml 在根目录，或在 TTMigrate/ 子目录
      - name: Generate + Build + Package
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          if [ -f "$WS/project.yml" ]; then
            WORK="$WS"
          elif [ -f "$WS/TTMigrate/project.yml" ]; then
            WORK="$WS/TTMigrate"
          else
            echo "ERROR: project.yml not found"; exit 1
          fi
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"

          xcodegen generate
          xcodebuild \
            -project TTMigrate.xcodeproj \
            -scheme TTMigrate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

          sed -i '' $'s/\r$//' scripts/package-tipa.sh || true
          chmod +x scripts/package-tipa.sh
          bash scripts/package-tipa.sh

          mkdir -p "$WS/artifacts"
          cp dist/*.tipa "$WS/artifacts/" 2>/dev/null || true
          cp dist/*.ipa  "$WS/artifacts/" 2>/dev/null || true
          ls -lh "$WS/artifacts"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTMigrate-tipa
          path: artifacts/*
          if-no-files-found: error
